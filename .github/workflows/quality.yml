name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same ruff version as .pre-commit-config.yaml, so CI and local hooks agree.
      - name: Install ruff
        run: python -m pip install ruff==0.8.1

      - name: Run ruff lint
        run: ruff check .

      - name: Check ruff formatting
        run: ruff format --check .
