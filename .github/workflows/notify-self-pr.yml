name: Assign Me on My PRs

on:
  pull_request:
    types: [opened]

jobs:
  assign-author:
    if: github.event.pull_request.user.login == 'pnwilly'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Assign PR author
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            if (pr.assignees?.some((assignee) => assignee.login === author)) {
              return;
            }

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number,
              assignees: [author],
            });
