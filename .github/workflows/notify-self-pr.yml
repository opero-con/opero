name: Notify Me on My PRs

on:
  pull_request:
    types: [opened]

jobs:
  notify-owner:
    if: github.event.pull_request.user.login == 'pnwilly'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Mention PR author
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- self-pr-notification -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            if (comments.some((comment) => comment.body?.includes(marker))) {
              return;
            }

            const message = pr.draft
              ? `you have a draft PR: **${pr.title}**`
              : `your PR is now open: **${pr.title}**`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `${marker}
            @${author} — ${message}`,
            });
